[package]
name = "bast3st-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.2"
actix-web = "4.15.0"
config = "0.15.26"
derive-getters = "0.5.0"
dotenvy = "0.15.7"
env_logger = "0.11.11"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "sqlx-toml"] }

# API documentation
schemars = "1.2.2"
utoipa = { version = "6.0.0", default-features = false, features = ["macros", "actix_extras"] }
utoipa-actix-web = { version = "0.2.0" }
utoipa-scalar = { version = "0.4.0", default-features = false, features = ["actix-web"] }
tokio = { version = "1.53.1", features = ["rt"] }
passwords = { version = "3.1.18" }
argon2 = "0.6.0"
either = "1.18.0"

[dependencies.bast3st-eval]
git = "https://github.com/Marcel-Scherzinger/bast3st-eval"

[dependencies.smodel]
git = "https://github.com/Marcel-Scherzinger/scratch-test-model"
package = "scratch-test-model"
default-features = false
features = ["sb3", "serde", "schemars"]

[features]
default = ["admin-api"]
admin-api = []
